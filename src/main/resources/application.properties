spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# Printing every SQL statement to the log costs CPU and log volume on every request (an admin page load runs dozens).
# Off by default; set JPA_SHOW_SQL=true in the environment when you need to debug queries.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ── Schema versioning (Flyway) — see docs/DATABASE_MIGRATIONS.md ──
# The existing database was built by Hibernate (ddl-auto=update) before Flyway was adopted. On first start Flyway
# BASELINES it at version 1: it creates only the flyway_schema_history table and runs no SQL against your data.
# An empty database runs V1 (a no-op) and Hibernate creates the tables as before. Every later schema change goes in a
# new V2+ file. Kill switch: set FLYWAY_ENABLED=false in the environment to run exactly as before Flyway existed.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Flyway's clean command drops every object in the schema. Never allow it from the app.
spring.flyway.clean-disabled=true

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.url=https://api.anthropic.com/v1/messages
# ── Admin security (see AdminMfaController / AdminSessionGuard) ──
# Public admin self-registration was removed. Promote an existing account in the DB, then enroll its authenticator.
# REQUIRED: base64 of 32 random bytes (openssl rand -base64 32). Encrypts admin TOTP secrets at rest.
# If unset, admin sign-in is refused (fail closed).
admin.mfa.key=${ADMIN_MFA_KEY:}
# Keep false except while enrolling a new admin's authenticator, then set it back to false.
admin.mfa.enrollment-open=${ADMIN_MFA_ENROLLMENT_OPEN:false}
admin.mfa.issuer=${ADMIN_MFA_ISSUER:Adaptive Learning}
# Idle / absolute session limits for admins, and how long a step-up (code re-entry) stays valid.
admin.session.idle-minutes=${ADMIN_IDLE_MINUTES:15}
admin.session.absolute-minutes=${ADMIN_ABSOLUTE_MINUTES:120}
admin.stepup.window-minutes=${ADMIN_STEPUP_MINUTES:10}

resend.api.key=${RESEND_API_KEY}
app.mail.from=${APP_MAIL_FROM:Learning System <onboarding@resend.dev>}


# Compress text responses (HTML/CSS/JS/JSON). Admin JS/CSS/HTML shrinks about 3x on the wire (measured: ~626 KB -> ~187 KB).
# Responses under 1 KB and already-compressed types (images, PDFs) are left alone.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,text/javascript,application/json,image/svg+xml

# Don't hold a DB connection for the whole request (Claude calls can take minutes); pool sized for ~20 concurrent users.
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=20000
