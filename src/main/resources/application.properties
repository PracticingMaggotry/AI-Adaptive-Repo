spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.url=https://api.anthropic.com/v1/messages
admin.signup.key=${ADMIN_SIGNUP_KEY:a1b2c3d4e5f6yourcleanrandomvaluehere}

r2.endpoint=${R2_ENDPOINT}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}

resend.api.key=${RESEND_API_KEY}
app.mail.from=${APP_MAIL_FROM:Learning System <onboarding@resend.dev>}

