<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Learning System | Redirecting to Admin Overview</title>
    <!--
        Retired entry point. The dashboard content now lives at admin.html#/overview.

        This file is kept (not deleted) because the server and login still send admins here:
          - AuthInterceptor redirects an admin who opens a student page to /admindashboard.html
          - login.js sends a freshly logged-in admin to /admindashboard.html
        Both keep working through this redirect.

        Authentication / authorization is unchanged and is NOT performed here: AuthInterceptor already gates this page
        server-side (logged-out -> /login.html, non-admin -> /dashboard.html), exactly as it gates admin.html, and
        admin.html re-checks /api/me itself. So only a logged-in admin ever receives this document.

        No redirect loop: admin.html never links or redirects back to admindashboard.html.
        location.replace() keeps this page out of the history, so Back does not bounce the user here again.
    -->
    <noscript><meta http-equiv="refresh" content="0; url=admin.html#/overview" /></noscript>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #1f2937; }
        p { font-size: .95rem; padding: 0 24px; text-align: center; }
        a { color: #0e7490; font-weight: 700; }
    </style>
</head>
<body>
    <p>The admin dashboard has moved. Redirecting to the <a href="admin.html#/overview">Admin Overview</a>…</p>
    <script>
        window.location.replace("admin.html#/overview");
    </script>
</body>
</html>
