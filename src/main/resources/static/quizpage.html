<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning System | Adaptive Quiz</title>
    <link rel="stylesheet" href="dashboard.css" />
    <style>
        .whole {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .main {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            min-width: 0;
        }
        .quiz-wrapper{max-width:820px;margin:0 auto;padding:20px 26px}.quiz-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.quiz-topic{font-size:.78rem;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:.05em}.quiz-counter{font-size:1rem;font-weight:800;color:#111827}.timer-ring-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}.timer-ring{position:relative;width:56px;height:56px}.timer-ring svg{transform:rotate(-90deg)}.timer-ring-track{fill:none;stroke:#e5e7eb;stroke-width:4}.timer-ring-fill{fill:none;stroke:#3b82f6;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}.timer-number{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.95rem;font-weight:800;color:#111827}.timer-label{font-size:.65rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em}.quiz-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}.quiz-progress-bar{flex:1;height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.quiz-progress-fill{height:100%;background:#3b82f6;border-radius:99px;transition:width .4s ease}.quiz-progress-pct{font-size:.78rem;font-weight:800;color:#6b7280;min-width:36px;text-align:right}.quiz-loading,.quiz-error,.question-card,.summary-screen{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 6px 18px rgba(15,23,42,.06)}.quiz-loading{padding:52px 30px;text-align:center}.quiz-loading-spinner{width:42px;height:42px;border:4px solid #e5e7eb;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.quiz-loading h3{margin:0 0 8px;color:#111827}.quiz-loading p{margin:4px 0;color:#6b7280}.quiz-error{padding:34px 28px;text-align:center;background:#fef2f2;border-color:#fecaca}.quiz-error h3{color:#991b1b;margin:0 0 8px}.quiz-error p{color:#7f1d1d}.question-card{padding:30px}.question-type-badge{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 12px;border-radius:999px;margin-bottom:14px;background:#eff6ff;color:#1d4ed8}.question-text{font-size:1.08rem;font-weight:800;color:#111827;margin-bottom:22px;line-height:1.55;white-space:pre-wrap}.options-list{display:flex;flex-direction:column;gap:12px}.option-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;cursor:pointer;font-size:.94rem;color:#374151;text-align:left;width:100%;transition:border-color .15s,background .15s,transform .1s}.option-btn:hover:not(:disabled){border-color:#93c5fd;background:#eff6ff;transform:translateX(3px)}.option-letter{width:30px;height:30px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;flex-shrink:0}.option-btn.selected{border-color:#3b82f6;background:#eff6ff}.option-btn.selected .option-letter{background:#3b82f6;color:#fff}.option-btn.correct{border-color:#10b981;background:#f0fdf4}.option-btn.correct .option-letter{background:#10b981;color:#fff}.option-btn.wrong{border-color:#ef4444;background:#fef2f2}.option-btn.wrong .option-letter{background:#ef4444;color:#fff}.option-btn:disabled{cursor:default}.feedback-banner{display:flex;gap:12px;padding:14px 16px;border-radius:12px;margin-top:18px;font-size:.9rem;line-height:1.5}.correct-fb{background:#f0fdf4;border:1px solid #bbf7d0;color:#065f46}.wrong-fb{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}.quiz-nav{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}.tip-toggle{margin-left:auto}.tip-box{display:none;margin-top:14px;padding:13px 16px;background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;font-size:.88rem;color:#92400e}.tip-box.visible{display:block}.dot-nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px;justify-content:center}.dot{width:11px;height:11px;border-radius:50%;background:#e5e7eb;cursor:pointer}.dot.active{background:#3b82f6;transform:scale(1.25)}.dot.answered-correct{background:#10b981}.dot.answered-partial{background:#f59e0b}.dot.answered-wrong{background:#ef4444}.summary-screen{padding:34px 30px}.summary-title{font-size:1.5rem;font-weight:900;color:#111827;margin-bottom:6px}.summary-sub{font-size:.92rem;color:#6b7280;margin-bottom:24px}.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}.summary-stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:17px 12px;text-align:center}.summary-stat-value{font-size:1.9rem;font-weight:900;line-height:1;margin-bottom:5px}.summary-stat-label{font-size:.75rem;color:#6b7280}.summary-breakdown-title{font-size:.85rem;font-weight:800;color:#374151;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}.breakdown-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:.88rem}.breakdown-num{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0}.correct-num{background:#d1fae5;color:#065f46}.wrong-num{background:#fee2e2;color:#991b1b}.neutral-num{background:#fef3c7;color:#92400e}.breakdown-q{flex:1;color:#374151}.result-correct{color:#10b981;font-weight:800}.result-wrong{color:#ef4444;font-weight:800}.result-neutral{color:#f59e0b;font-weight:800}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}.shake{animation:shake .35s ease}@media(max-width:700px){.summary-stats{grid-template-columns:1fr}.quiz-wrapper{padding:12px}.question-card{padding:22px}}
    </style>
    <!-- Math (KaTeX) + code (highlight.js) rendering — see api.js renderRichText()/renderMathOnly() -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>
<body>
<div class="whole">
    <aside class="sidebar">
        <div class="brand"><div class="brand-badge">L</div><div class="brand-text"><div class="brand-name">Learning System</div><div class="brand-sub">Adaptive Dashboard</div></div></div>
        <nav class="nav">
            <a class="nav-item" href="dashboard.html"><span class="icon">▦</span><span>Dashboard</span></a>
            <a class="nav-item active" href="quizhub.html"><span class="icon">✎</span><span>Quiz Hub</span></a>
            <a class="nav-item" href="learninghub.html"><span class="icon">🎓</span><span>Learning Hub</span></a>
            <a class="nav-item" href="quizfinish.html"><span class="icon">📈</span><span>Performance</span></a>
            <a class="nav-item" href="reports.html"><span class="icon">🗂</span><span>Reports</span></a>
        </nav>
    </aside>
    <main class="main">
        <div class="topbar"><h1 class="page-title">Adaptive Quiz</h1><div class="topbar-actions"><div class="search"><span class="search-icon">🔎</span><input type="text" placeholder="Search topics, quizzes..." /></div><a class="user-pill" href="profile.html"><div class="avatar">U</div><div class="user-meta"><div class="user-name">User</div><div class="user-sub">General User</div></div></a></div></div>
        <div class="quiz-wrapper" id="quizWrapper">
            <div class="quiz-meta" id="quizMetaBar" style="display:none;"><div class="quiz-meta-left"><span class="quiz-topic" id="quizTopicLabel">Topic</span><span class="quiz-counter">Question <span id="questionNumber">1</span> of <span id="totalQuestions">?</span></span></div><div class="timer-ring-wrap"><div class="timer-ring"><svg width="56" height="56" viewBox="0 0 56 56"><circle class="timer-ring-track" cx="28" cy="28" r="24"/><circle class="timer-ring-fill" id="timerRingFill" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="0"/></svg><div class="timer-number" id="timerNumber">30</div></div><span class="timer-label">seconds</span></div></div>
            <div class="quiz-progress-row" id="quizProgressRow" style="display:none;"><div class="quiz-progress-bar"><div class="quiz-progress-fill" id="progressFill" style="width:0%"></div></div><span class="quiz-progress-pct" id="progressPct">0%</span></div>
            <div class="quiz-loading" id="quizLoadingState"><div class="quiz-loading-spinner"></div><h3>Loading your quiz...</h3><p id="loadingTopicLabel">Fetching questions from the server.</p></div>
            <div class="question-card" id="questionCard" style="display:none;"><div id="quizContainer"></div><div class="tip-box" id="tipBox"></div><div class="quiz-nav"><button class="btn ghost" id="prevBtn">← Back</button><button class="btn primary" id="submitBtn">Submit Answer</button><button class="btn ghost tip-toggle" id="tipBtn">💡 Hint</button></div></div>
            <div class="dot-nav" id="dotNav" style="display:none;"></div>
        </div>
    </main>
</div>
<script src="api.js"></script>
<script>
    // Redirect the avatar/profile link to the admin panel for admin accounts
    // and populate the topbar user name
    (async () => {
        try {
            const me = await apiFetch("/api/me");
            if (me && me.isAdmin) {
                window.location.href = "/admindashboard.html";
            }
            if (me && me.name) {
                const nameEl = document.querySelector(".user-name");
                if (nameEl) nameEl.textContent = me.name.split(" ")[0];
            }
        } catch (err) {}
    })();

    const TIME_LIMITS = { ESSAY: 300, MATCHING: 60, SORTING: 60, DIAGRAM: 60, DEFAULT: 30 };
    const CIRCUMFERENCE = 150.8;
    let quizData = [];
    let activeTopic = "Topic A";
    let activeDifficulty = "Easy";
    let currentIndex = 0;
    let answered = false;
    let timerInterval = null;
    let currentTimeLimit = TIME_LIMITS.DEFAULT;
    let timeLeft = currentTimeLimit;
    let quizStartTime = null;
    const results = [];

    function getTimeLimitForType(type) {
        return TIME_LIMITS[type] || TIME_LIMITS.DEFAULT;
    }

    const questionCard = document.getElementById("questionCard");
    const quizContainer = document.getElementById("quizContainer");
    const tipBox = document.getElementById("tipBox");
    const tipBtn = document.getElementById("tipBtn");
    const submitBtn = document.getElementById("submitBtn");
    const prevBtn = document.getElementById("prevBtn");
    const dotNav = document.getElementById("dotNav");
    const timerNumber = document.getElementById("timerNumber");
    const timerRingFill = document.getElementById("timerRingFill");
    const progressFill = document.getElementById("progressFill");
    const progressPct = document.getElementById("progressPct");
    const quizMetaBar = document.getElementById("quizMetaBar");
    const quizProgressRow = document.getElementById("quizProgressRow");
    const quizLoadingState = document.getElementById("quizLoadingState");

    function getQuizSettings() {
        const params = new URLSearchParams(window.location.search);
        const topic = params.get("topic") || sessionStorage.getItem("quizTopic") || "Topic A";
        const difficulty = params.get("difficulty") || sessionStorage.getItem("quizDifficulty") || "Easy";
        sessionStorage.setItem("quizTopic", topic);
        sessionStorage.setItem("quizDifficulty", difficulty);
        return { topic, difficulty };
    }

    function showLoading(topic, difficulty) {
        quizLoadingState.style.display = "block";
        questionCard.style.display = "none";
        dotNav.style.display = "none";
        quizMetaBar.style.display = "none";
        quizProgressRow.style.display = "none";
        document.getElementById("loadingTopicLabel").textContent = `Loading ${topic} · ${difficulty} questions from the server...`;
    }

    function showError(message) {
        quizLoadingState.style.display = "none";
        questionCard.style.display = "none";
        dotNav.style.display = "none";
        quizMetaBar.style.display = "none";
        quizProgressRow.style.display = "none";
        const wrapper = document.getElementById("quizWrapper");
        const old = wrapper.querySelector(".quiz-error");
        if (old) old.remove();
        const div = document.createElement("div");
        div.className = "quiz-error";
        div.innerHTML = `<h3>⚠️ Could not load quiz</h3><p>${escapeHtml(message)}</p><p style="margin-top:14px;"><a class="btn ghost" href="quizhub.html">← Back to Quiz Hub</a></p>`;
        wrapper.appendChild(div);
    }

    function showQuizUI() {
        quizLoadingState.style.display = "none";
        questionCard.style.display = "block";
        dotNav.style.display = "flex";
        quizMetaBar.style.display = "flex";
        quizProgressRow.style.display = "flex";
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>\"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function mapBackendQuestion(q) {
        const type = (q.type || "MCQ").toUpperCase();
        const payload = q.payload ? (typeof q.payload === "string" ? JSON.parse(q.payload) : q.payload) : null;
        const optMap = { A: q.optionA, B: q.optionB, C: q.optionC, D: q.optionD };
        const cleanCorrect = q.correctAnswer ? q.correctAnswer.toString().trim().toUpperCase() : "";
        return {
            _backendId: q.id,
            type: type,
            topic: q.topic || activeTopic,
            difficulty: q.difficulty || activeDifficulty,
            question: q.question || q.questionText || "Question unavailable",
            options: [q.optionA || "Option A", q.optionB || "Option B", q.optionC || "Option C", q.optionD || "Option D"],
            correctAnswer: optMap[cleanCorrect] || q.correctAnswer,
            payload: payload,
            tip: q.hint || "Review the uploaded handout carefully.",
            explanation: q.explanation || "This question was generated from uploaded learning material."
        };
    }

    async function loadQuiz() {
        const { topic, difficulty } = getQuizSettings();
        activeTopic = topic;
        activeDifficulty = difficulty;
        document.getElementById("quizTopicLabel").textContent = topic;
        document.title = `${topic} Quiz | Learning System`;
        showLoading(topic, difficulty);
        try {
            const raw = await apiFetch(`/api/quiz/questions?topic=${encodeURIComponent(topic)}&difficulty=${encodeURIComponent(difficulty)}`);
            const rawList = Array.isArray(raw) ? raw : (raw.questions || []);
            if (!rawList || rawList.length === 0) {
                showError(`No ${difficulty} questions found for "${topic}". Upload a readable PDF/TXT for this topic or try Easy difficulty.`);
                return;
            }
            quizData = rawList.map(mapBackendQuestion);
            results.length = 0;
            quizData.forEach(() => results.push(null));
            document.getElementById("totalQuestions").textContent = quizData.length;
            quizStartTime = Date.now();
            showQuizUI();
            buildDots();
            renderQuestion();
        } catch (err) {
            console.error("loadQuiz error:", err);
            showError(err.message || "Failed to connect to the server. Make sure Spring Boot and MySQL are running.");
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        const q = quizData[currentIndex];
        currentTimeLimit = getTimeLimitForType(q.type);
        timeLeft = currentTimeLimit;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                if (!answered) autoSubmit();
            }
        }, 1000);
    }

    function formatTimeLeft(seconds) {
        if (seconds >= 60) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${String(s).padStart(2, "0")}`;
        }
        return String(seconds);
    }

    function updateTimerDisplay() {
        timerNumber.textContent = formatTimeLeft(timeLeft);
        timerRingFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - timeLeft / currentTimeLimit);
        const dangerAt = currentTimeLimit / 3;
        const warnAt = currentTimeLimit * 2 / 3;
        if (timeLeft <= dangerAt) { timerRingFill.style.stroke = "#ef4444"; timerNumber.style.color = "#ef4444"; }
        else if (timeLeft <= warnAt) { timerRingFill.style.stroke = "#f59e0b"; timerNumber.style.color = "#f59e0b"; }
        else { timerRingFill.style.stroke = "#3b82f6"; timerNumber.style.color = "#111827"; }
        const label = document.querySelector(".timer-label");
        if (label) label.textContent = timeLeft >= 60 ? "min:sec" : "seconds";
    }

    function stopTimer() { clearInterval(timerInterval); }

    function renderQuestion() {
        answered = results[currentIndex] !== null;
        tipBox.classList.remove("visible");
        tipBox.textContent = "";
        buildQuestion();
        if (!answered) startTimer();
        else { stopTimer(); showFeedback(currentIndex); lockInputs(); }
        updateMeta();
        updateDots();
    }

    const TYPE_LABELS = {
        MCQ: "Multiple Choice", TRUEFALSE: "True or False", MATCHING: "Matching",
        FILLBLANK: "Fill in the Blanks", ESSAY: "Short Answer", SORTING: "Sort & Classify",
        CONCEPTID: "Four Ideas – One Name", DIAGRAM: "Diagram Labeling"
    };

    function buildQuestion() {
        quizContainer.innerHTML = "";
        const q = quizData[currentIndex];
        const saved = results[currentIndex];

        const badge = document.createElement("div");
        badge.className = "question-type-badge";
        badge.textContent = TYPE_LABELS[q.type] || q.type;
        quizContainer.appendChild(badge);

        const qText = document.createElement("div");
        qText.className = "question-text";
        quizContainer.appendChild(qText);
        renderRichText(qText, q.question);

        const oldFeedback = questionCard.querySelector(".feedback-banner");
        if (oldFeedback) oldFeedback.remove();

        switch (q.type) {
            case "TRUEFALSE": buildTrueFalse(q, saved); break;
            case "MATCHING":  buildMatching(q, saved);  break;
            case "FILLBLANK": buildFillBlank(q, saved); break;
            case "ESSAY":     buildEssay(q, saved);     break;
            case "SORTING":   buildSorting(q, saved);   break;
            case "CONCEPTID": buildConceptId(q, saved); break;
            case "DIAGRAM":   buildDiagram(q, saved);   break;
            default:          buildMCQ(q, saved);        break;
        }
    }

    function buildMCQ(q, saved) {
        const list = document.createElement("div");
        list.className = "options-list";
        const letters = ["A","B","C","D"];
        q.options.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.disabled = !!saved;
            btn.dataset.value = opt;
            btn.innerHTML = `<span class="option-letter">${letters[i]}</span>`;
            const optTextEl = document.createElement("span");
            btn.appendChild(optTextEl);
            renderRichText(optTextEl, opt);
            if (saved) {
                if (opt === q.correctAnswer) btn.classList.add("correct");
                else if (opt === saved.answer) btn.classList.add("wrong");
            }
            btn.onclick = () => {
                list.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
            };
            list.appendChild(btn);
        });
        quizContainer.appendChild(list);
    }

    function buildTrueFalse(q, saved) {
        const list = document.createElement("div");
        list.className = "options-list";
        ["True", "False"].forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.disabled = !!saved;
            btn.dataset.value = opt;
            btn.innerHTML = `<span class="option-letter">${opt[0]}</span><span>${opt}</span>`;
            if (saved) {
                if (opt.toLowerCase() === (q.correctAnswer||"").toLowerCase()) btn.classList.add("correct");
                else if (opt === saved.answer) btn.classList.add("wrong");
            }
            btn.onclick = () => {
                list.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
            };
            list.appendChild(btn);
        });
        quizContainer.appendChild(list);
    }

    function buildMatching(q, saved) {
        const p = q.payload;
        if (!p) return;
        const wrap = document.createElement("div");
        wrap.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;";

        const leftCol = document.createElement("div");
        leftCol.style.cssText = "display:flex;flex-direction:column;gap:8px;";
        const rightCol = document.createElement("div");
        rightCol.style.cssText = "display:flex;flex-direction:column;gap:8px;";

        // Shuffle right items for display
        const rightOrder = p.rightItems.map((_, i) => i);
        if (!saved) rightOrder.sort(() => Math.random() - 0.5);

        p.leftItems.forEach((term, li) => {
            const termEl = document.createElement("div");
            termEl.style.cssText = "padding:10px 12px;background:#eff6ff;border:2px solid #bfdbfe;border-radius:10px;font-size:.88rem;font-weight:600;color:#1e40af;";
            termEl.textContent = term;

            const sel = document.createElement("select");
            sel.style.cssText = "width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-size:.88rem;background:#fff;";
            sel.disabled = !!saved;
            sel.dataset.leftIndex = li;
            const blank = document.createElement("option");
            blank.value = "";
            blank.textContent = "— select —";
            sel.appendChild(blank);
            rightOrder.forEach(ri => {
                const opt = document.createElement("option");
                opt.value = ri;
                opt.textContent = p.rightItems[ri];
                sel.appendChild(opt);
            });

            if (saved && saved.answer) {
                const match = saved.answer.find(a => a.left === li);
                if (match) sel.value = match.right;
                // Colour feedback: use server result (correctPairs is stripped from payload)
                if (match && saved.checkResult) {
                    const color = saved.checkResult.result === "correct" ? "#10b981" : "#ef4444";
                    const bg = saved.checkResult.result === "correct" ? "#f0fdf4" : "#fef2f2";
                    sel.style.borderColor = color;
                    sel.style.background = bg;
                }
            }

            leftCol.appendChild(termEl);
            rightCol.appendChild(sel);
        });

        wrap.appendChild(leftCol);
        wrap.appendChild(rightCol);
        quizContainer.appendChild(wrap);
        renderMathOnly(wrap);
    }

    function buildFillBlank(q, saved) {
        const p = q.payload;
        if (!p) return;
        const mode = p.mode || "typed";

        // NOTE: p.blanks[].answer is stripped server-side for security — only
        // the blank id is present. The word bank for drag-drop is therefore
        // unavailable before the student submits; grading is handled by the
        // /api/quiz/check endpoint which has the real answers.

        // Build the excerpt with blanks replaced by inputs or drag targets
        let excerptHtml = escapeHtml(p.excerpt);
        p.blanks.forEach(b => {
            if (mode === "dragdrop") {
                excerptHtml = excerptHtml.replace(
                    `{{${b.id}}}`,
                    `<span class="blank-drop" data-blank-id="${b.id}"
                    style="display:inline-block;min-width:90px;padding:3px 10px;border-bottom:2px solid #3b82f6;
                    background:#eff6ff;border-radius:4px;color:#1e40af;font-weight:700;cursor:pointer;
                    transition:background 0.15s, border-color 0.15s;">[drop here]</span>`
                );
            } else {
                excerptHtml = excerptHtml.replace(
                    `{{${b.id}}}`,
                    `<input type="text" class="blank-input" data-blank-id="${b.id}"
                    style="display:inline-block;width:110px;padding:3px 8px;border:none;border-bottom:2px solid #3b82f6;
                    background:transparent;font-size:.95rem;outline:none;" placeholder="..." ${saved ? "disabled" : ""}/>`
                );
            }
        });

        const excerptEl = document.createElement("div");
        excerptEl.style.cssText = "padding:14px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;font-size:.95rem;line-height:2.2;margin-bottom:12px;";
        excerptEl.innerHTML = excerptHtml;
        quizContainer.appendChild(excerptEl);
        renderMathOnly(excerptEl);

        if (mode === "dragdrop" && !saved) {
            // Build a word bank with REAL answer words from the server payload.
            // For drag-drop the words are visible to the student by design — the
            // challenge is matching each word to the right blank. The server now
            // sends them in p.wordBank (pre-shuffled) or as p.blanks[].answer.
            const hint = document.createElement("div");
            hint.style.cssText = "font-size:.78rem;color:#6b7280;margin-bottom:8px;font-weight:600;";
            hint.textContent = "💡 Drag the words below into the correct blanks:";
            quizContainer.appendChild(hint);

            const bank = document.createElement("div");
            bank.id = "wordBank";
            bank.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:10px;background:#f1f5f9;border-radius:10px;min-height:44px;border:2px dashed #cbd5e1;";

            // Get real answer words — prefer pre-shuffled wordBank from server,
            // fall back to extracting from blanks[] and shuffling client-side.
            let wordList = [];
            if (p.wordBank && Array.isArray(p.wordBank) && p.wordBank.length > 0) {
                wordList = [...p.wordBank];
            } else if (p.blanks && p.blanks.length > 0) {
                wordList = p.blanks.map(b => b.answer || "").filter(w => w);
                wordList.sort(() => Math.random() - 0.5);
            }

            wordList.forEach((word, idx) => {
                const chip = document.createElement("div");
                chip.className = "word-chip";
                chip.dataset.word = word;
                chip.draggable = true;
                chip.textContent = word;
                chip.style.cssText = "padding:6px 14px;background:#fff;border:2px solid #3b82f6;border-radius:8px;font-size:.88rem;font-weight:600;color:#1e40af;cursor:grab;user-select:none;transition:opacity 0.15s;";
                chip.addEventListener("dragstart", e => {
                    e.dataTransfer.setData("text/plain", word);
                    chip.style.opacity = "0.5";
                });
                chip.addEventListener("dragend", () => { chip.style.opacity = "1"; });
                bank.appendChild(chip);
            });
            quizContainer.appendChild(bank);

            // Wire up drop zones
            excerptEl.querySelectorAll(".blank-drop").forEach(target => {
                target.addEventListener("dragover", e => {
                    e.preventDefault();
                    target.style.background = "#dbeafe";
                    target.style.borderBottomColor = "#1d4ed8";
                });
                target.addEventListener("dragleave", () => {
                    if (!target.dataset.filledWord) {
                        target.style.background = "#eff6ff";
                        target.style.borderBottomColor = "#3b82f6";
                    }
                });
                target.addEventListener("drop", e => {
                    e.preventDefault();
                    const droppedWord = e.dataTransfer.getData("text/plain");
                    if (!droppedWord) return;

                    // If this zone already has a word, return it to the bank
                    if (target.dataset.filledWord) {
                        const prevWord = target.dataset.filledWord;
                        const prevChip = bank.querySelector(`.word-chip[data-word="${CSS.escape(prevWord)}"]`);
                        if (prevChip) prevChip.style.display = "";
                    }

                    // Hide the chip we just placed
                    const droppedChip = bank.querySelector(`.word-chip[data-word="${CSS.escape(droppedWord)}"]`);
                    if (droppedChip) droppedChip.style.display = "none";

                    target.textContent = droppedWord;
                    target.dataset.filledWord = droppedWord;
                    target.style.background = "#d1fae5";
                    target.style.borderBottomColor = "#10b981";
                    target.style.color = "#065f46";
                });

                // Click a filled zone to return its word to the bank
                target.addEventListener("click", () => {
                    if (!target.dataset.filledWord) return;
                    const prevWord = target.dataset.filledWord;
                    const chip = bank.querySelector(`.word-chip[data-word="${CSS.escape(prevWord)}"]`);
                    if (chip) chip.style.display = "";
                    delete target.dataset.filledWord;
                    target.textContent = "[drop here]";
                    target.style.background = "#eff6ff";
                    target.style.borderBottomColor = "#3b82f6";
                    target.style.color = "#1e40af";
                });
            });
        }

        if (saved && saved.answer) {
            excerptEl.querySelectorAll(".blank-input").forEach(inp => {
                const match = saved.answer.find(a => String(a.id) === inp.dataset.blankId);
                if (match) {
                    inp.value = match.filled;
                    if (saved.checkResult?.result === "correct") {
                        inp.style.borderBottomColor = "#10b981";
                    } else if (saved.checkResult?.result === "wrong") {
                        inp.style.borderBottomColor = "#ef4444";
                    }
                }
            });
            excerptEl.querySelectorAll(".blank-drop").forEach(target => {
                const match = saved.answer.find(a => String(a.id) === String(target.dataset.blankId));
                if (match && match.filled) {
                    target.textContent = match.filled;
                    target.dataset.filled = match.blankId || match.id;
                }
            });
        }
    }

                col.addEventListener("dragover", e => { e.preventDefault(); col.style.borderColor = "#3b82f6"; });

    function getAnswer() {
        const q = quizData[currentIndex];
        switch (q.type) {
            case "ESSAY":
                return document.getElementById("essayInput")?.value?.trim() || null;
            case "CONCEPTID":
                return document.getElementById("conceptInput")?.value?.trim() || null;
            case "FILLBLANK":
            case "DIAGRAM": {
                const inputs = quizContainer.querySelectorAll(".blank-input, input[data-blank-id], input[data-label-id]");
                const drops = quizContainer.querySelectorAll(".blank-drop");
                if (inputs.length === 0 && drops.length === 0) return null;
                const answers = [];
                inputs.forEach(inp => {
                    const id = inp.dataset.blankId || inp.dataset.labelId;
                    answers.push({ id: Number(id), filled: inp.value.trim() });
                });
                drops.forEach(drop => {
                    // dataset.filledWord holds the word that was dragged into this blank.
                    // (dataset.filled is only set when re-rendering a previously saved answer.)
                    const filled = drop.dataset.filledWord
                        ? drop.dataset.filledWord
                        : "";
                    answers.push({ id: Number(drop.dataset.blankId), filled });
                });
                return answers.length ? answers : null;
            }
            case "MATCHING": {
                const selects = quizContainer.querySelectorAll("select[data-left-index]");
                if (!selects.length) return null;
                const pairs = [];
                selects.forEach(sel => {
                    if (sel.value !== "") pairs.push({ left: Number(sel.dataset.leftIndex), right: Number(sel.value) });
                });
                return pairs.length === selects.length ? pairs : null;
            }
            case "SORTING": {
                const chips = quizContainer.querySelectorAll(".sort-chip[data-assigned]");
                if (!chips.length) return null;
                const assignments = [];
                chips.forEach(chip => assignments.push({ text: chip.dataset.text, assigned: chip.dataset.assigned, correct: chip.dataset.correct }));
                return assignments.length ? assignments : null;
            }
            default: {
                const selected = quizContainer.querySelector(".option-btn.selected");
                return selected ? selected.dataset.value : null;
            }
        }
    }

    function evaluate(q, answer) {
        if (!answer) return "wrong";
        switch (q.type) {
            case "ESSAY":
                return "neutral"; // reviewed later
            case "CONCEPTID":
                return answer.trim().toLowerCase() === (q.payload?.correctAnswer || "").trim().toLowerCase() ? "correct" : "wrong";
            case "FILLBLANK":
            case "DIAGRAM":
                if (!Array.isArray(answer)) return "wrong";
                const allCorrect = answer.every(a => a.filled.trim().toLowerCase() === a.answer.trim().toLowerCase());
                return allCorrect ? "correct" : "wrong";
            case "MATCHING": {
                if (!Array.isArray(answer) || !q.payload?.correctPairs) return "wrong";
                const correct = q.payload.correctPairs.every(pair =>
                    answer.some(a => a.left === pair[0] && a.right === pair[1])
                );
                return correct ? "correct" : "wrong";
            }
            case "SORTING": {
                if (!Array.isArray(answer)) return "wrong";
                const allRight = answer.every(a => a.assigned === a.correct);
                return allRight ? "correct" : "wrong";
            }
            default:
                return answer.trim().toLowerCase() === String(q.correctAnswer || "").trim().toLowerCase() ? "correct" : "wrong";
        }
    }

    function autoSubmit() {
        const q = quizData[currentIndex];
        results[currentIndex] = { result: "wrong", answer: null, timesUp: true, checkResult: { result: "wrong", correctAnswer: "", explanation: q.explanation || "" } };
        answered = true;
        showFeedback(currentIndex);
        lockInputs();
        updateDots();
        submitBtn.textContent = currentIndex < quizData.length - 1 ? "Next Question →" : "See My Results";
    }

    submitBtn.onclick = async () => {
        if (answered) {
            if (currentIndex < quizData.length - 1) { currentIndex++; renderQuestion(); }
            else showSummary();
            return;
        }
        const answer = getAnswer();
        if (!answer) {
            submitBtn.classList.add("shake");
            setTimeout(() => submitBtn.classList.remove("shake"), 400);
            return;
        }
        stopTimer();
        const q = quizData[currentIndex];

        // Show a neutral "checking" state immediately so the UI feels responsive
        // while we wait for the server to grade the answer. The server is the
        // only place that knows the correct answer (it's stripped from the
        // question payload for security), so we cannot evaluate client-side.
        submitBtn.disabled = true;
        submitBtn.textContent = "Checking...";

        let checkResult = null;
        try {
            checkResult = await apiFetch("/api/quiz/check", {
                method: "POST",
                body: JSON.stringify({ questionId: q._backendId, selectedAnswer: answer })
            });
        } catch (err) {
            // Network/server failure — fall back to neutral so the student
            // isn't falsely penalised, and let the final submit do real grading.
            checkResult = { success: false, result: "neutral", correctAnswer: "", explanation: q.explanation || "" };
        }

        const result = checkResult?.result || "neutral";
        results[currentIndex] = { result, answer, checkResult };
        answered = true;
        showFeedback(currentIndex);
        lockInputs();
        updateDots();
        submitBtn.disabled = false;
        submitBtn.textContent = currentIndex < quizData.length - 1 ? "Next Question →" : "See My Results";
    };

    function lockInputs() {
        quizContainer.querySelectorAll("button, input, textarea, select").forEach(el => el.disabled = true);
        quizContainer.querySelectorAll(".sort-chip, .drag-chip").forEach(el => el.draggable = false);
    }

    function showFeedback(index) {
        const q = quizData[index];
        const r = results[index];
        if (!r) return;
        const old = questionCard.querySelector(".feedback-banner");
        if (old) old.remove();
        const banner = document.createElement("div");
        banner.className = "feedback-banner";

        // Use the server's authoritative correct answer and explanation when
        // available (from /api/quiz/check). Fall back to the local question
        // data only for essay (neutral) or if the check call failed.
        const serverResult = r.checkResult;
        const correctAnswerText = serverResult?.correctAnswer || q.correctAnswer || "";
        const explanationText = serverResult?.explanation || q.explanation || "";

        if (r.timesUp) {
            banner.classList.add("wrong-fb");
            banner.innerHTML = `<span>⏰</span><div><strong>Time's up.</strong>${correctAnswerText ? ` Correct answer: <em>${escapeHtml(correctAnswerText)}</em>` : ""}<br>${escapeHtml(explanationText)}</div>`;
        } else if (r.result === "correct") {
            banner.classList.add("correct-fb");
            banner.innerHTML = `<span>✅</span><div><strong>Correct!</strong> ${escapeHtml(explanationText)}</div>`;
        } else if (r.result === "partial") {
            banner.classList.add("wrong-fb");
            banner.style.background = "#fef3c7";
            banner.style.borderColor = "#fcd34d";
            banner.style.color = "#92400e";
            const fraction = serverResult?.fraction != null ? ` (${Math.round(serverResult.fraction * 100)}% credit)` : "";
            banner.innerHTML = `<span>🟡</span><div><strong>Partial credit${fraction}.</strong>${correctAnswerText ? ` Correct answer: <em>${escapeHtml(correctAnswerText)}</em>` : ""}<br>${escapeHtml(explanationText)}</div>`;
        } else if (r.result === "neutral") {
            // Essay — graded by AI at quiz end
            banner.classList.add("correct-fb");
            banner.style.background = "#eff6ff";
            banner.style.borderColor = "#bfdbfe";
            banner.style.color = "#1e40af";
            banner.innerHTML = `<span>✍️</span><div><strong>Answer submitted.</strong> Essay answers are AI-graded at the end of the quiz.</div>`;
        } else {
            banner.classList.add("wrong-fb");
            banner.innerHTML = `<span>❌</span><div><strong>Not quite.</strong>${correctAnswerText ? ` Correct answer: <em>${escapeHtml(correctAnswerText)}</em>` : ""}<br>${escapeHtml(explanationText)}</div>`;
        }
        questionCard.insertBefore(banner, questionCard.querySelector(".quiz-nav"));
        renderMathOnly(banner);

        // For MCQ/TRUEFALSE: colour the option buttons using the server's correct answer
        if ((q.type === "MCQ" || q.type === "TRUEFALSE") && serverResult?.correctAnswer) {
            quizContainer.querySelectorAll(".option-btn").forEach(btn => {
                if (btn.dataset.value === serverResult.correctAnswer) btn.classList.add("correct");
                else if (btn.classList.contains("selected")) btn.classList.add("wrong");
            });
        }
    }

    prevBtn.onclick = () => {
        if (currentIndex > 0) {
            currentIndex--;

    tipBtn.onclick = () => {
        const q = quizData[currentIndex];

    function buildDots() {
        dotNav.innerHTML = "";
        quizData.forEach((_, i) => {
            const dot = document.createElement("div");

            dot.onclick = () => { currentIndex = i; renderQuestion(); };

    function updateDots() {
        dotNav.querySelectorAll(".dot").forEach((dot, i) => {
            dot.className = "dot";

            if (results[i]) dot.classList.add(results[i].result === "correct" ? "answered-correct" : results[i].result === "partial" ? "answered-partial" : "answered-wrong");

    function formatYourAnswerDisplay(q, answer) {
        if (!answer) return "No answer given";
        const type = (q.type || "MCQ").toUpperCase();
        switch (type) {
            case "MATCHING": {
                if (!Array.isArray(answer) || !q.payload) return "No answer given";
                const leftItems = q.payload.leftItems || [];
                const rightItems = q.payload.rightItems || [];
                const pairs = answer.map(a => `${leftItems[a.left] ?? "?"} → ${rightItems[a.right] ?? "?"}`);
                return pairs.length ? pairs.join("; ") : "No answer given";
            }
            case "SORTING": {
                if (!Array.isArray(answer) || !q.payload) return "No answer given";
                const labelA = q.payload.categoryA || "Category A";
                const labelB = q.payload.categoryB || "Category B";
                const groupA = answer.filter(a => a.assigned === "A").map(a => a.text);
                const groupB = answer.filter(a => a.assigned === "B").map(a => a.text);
                const parts = [];
                if (groupA.length) parts.push(`${labelA}: ${groupA.join(", ")}`);
                if (groupB.length) parts.push(`${labelB}: ${groupB.join(", ")}`);
                return parts.length ? parts.join(" | ") : "No answer given";
            }
            case "FILLBLANK":
            case "DIAGRAM": {
                if (!Array.isArray(answer)) return "No answer given";
                return answer.map(a => (a.filled && a.filled.trim()) || "(blank)").join(", ");
            }
            default:
                return typeof answer === "string" ? answer : JSON.stringify(answer);
        }
    }

    function getElapsedTime() {
        if (!quizStartTime) return "0s";
        const sec = Math.floor((Date.now() - quizStartTime) / 1000);
        return sec < 60 ? `${sec}s` : `${Math.floor(sec / 60)}m ${sec % 60}s`;
    }
