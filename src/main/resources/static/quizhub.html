<button class="u-position-right-30625" id="openDrawerBtn" onclick="openUploadDrawer()"
       >
    📤 Upload Handout
</button>

<script src="api.js"></script>
<script src="consent.js"></script>
<script src="sus-prompt.js"></script>
<script src="progress-log.js"></script>
<script src="replace-warning.js"></script>
<script src="upload-progress.js"></script>
<script src="material-upload.js"></script>
<script src="concept-progress.js"></script>
<script>
    function revealPage() {
        const loader = document.getElementById("pageLoader");
        if (loader) loader.classList.add("hidden");
    }

    let IS_PARTICIPANT = false;
    const meReady = (async () => {
        try {
            const me = await apiFetch("/api/me");
            if (me && me.isAdmin) {
                window.location.href = "/admindashboard.html"; return me; }
            if (me && me.name) {
                document.getElementById("topbarName").textContent = me.name.split(" ")[0];
                applyAvatarInitial(me.name);
            }
            if (me && me.isParticipant) {
                // Enrolled study participants can't upload; their handouts are assigned by an admin.
                IS_PARTICIPANT = true;
                document.body.classList.add("participant-mode");
                loadAssignedHandouts();
            }
            return me;
        } catch (err) { return null; }
    })();
    const WEAK_THRESHOLD = TOPIC_WEAK_BELOW;   // api.js: the one shared "needs practice" line
    if (window.ConceptProgress) { ConceptProgress.watchSlots(); ConceptProgress.highlightFromUrl(); }

    const quizData = {
        categories: [
            {
                id: "empty",
                name: "No Topics Yet",
                section: "Adaptive Learning",
                overview: "Upload a handout to get started.",
                topics: []
            }
        ]
    };

    let activeFilter = "all";

    function escapeAttr(value) {
        return String(value ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
    }

    // Same bands as every other page (api.js topicBand); the class names match the bar-fill-* styles.
    function masteryColor(m) { return topicBand(m).cls; }

    function motivation(m) {
        const b = topicBand(m).key;
        if (b === "mastered") return { text: "🌟 Mastered", cls: "motiv-great" };
        if (b === "on-track") return { text: "👍 On track", cls: "motiv-good" };
        return { text: "💪 Needs practice", cls: "motiv-keep" };
    }

    // One flat list of topic cards. With many topics the student can search (name, summary, category,
    // subtopics), filter by status, sort, and page through the cards instead of scrolling one long wall.
    const PAGE_SIZE = 12;      // cards drawn at a time
    const TOOLBAR_MIN = 6;     // search/filter/sort only appear once there are enough topics to need them
    const hubState = { query: "", status: null, sort: "attention", shown: PAGE_SIZE };
    let hubTopics = [];

    const STATUS_CHIPS = [
        { key: "needs-practice", label: "Needs practice" },
        { key: "new",            label: "New" },
        { key: "on-track",       label: "On track" },
        { key: "mastered",       label: "Mastered" }
    ];
    const STATUS_RANK = { "needs-practice": 0, "new": 1, "on-track": 2, "mastered": 3 };

    function topicStatus(t) { return t.mastery === null ? "new" : topicBand(t.mastery).key; }
    function byName(a, b) { return a.name.localeCompare(b.name, undefined, { sensitivity: "base", numeric: true }); }
    function lastDate(t) { return t.mastery === null ? "" : String(t.lastAttempt || ""); }

    const SORTERS = {
        attention: (a, b) => STATUS_RANK[topicStatus(a)] - STATUS_RANK[topicStatus(b)]
                             || (a.mastery ?? 101) - (b.mastery ?? 101) || byName(a, b),
        name:      byName,
        score:     (a, b) => (b.mastery ?? -1) - (a.mastery ?? -1) || byName(a, b),
        recent:    (a, b) => lastDate(b).localeCompare(lastDate(a)) || byName(a, b)
    };

    function filtersActive() { return !!(hubState.query.trim() || hubState.status); }

    function visibleTopics() {
        const terms = hubState.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
        return hubTopics
            .filter(t => (!hubState.status || topicStatus(t) === hubState.status)
                      && terms.every(w => t.searchText.includes(w)))
            .sort(SORTERS[hubState.sort]);
    }

    function renderToolbar() {
        const counts = {};
        hubTopics.forEach(t => { const k = topicStatus(t); counts[k] = (counts[k] || 0) + 1; });
        const bar = document.createElement("div");
        bar.className = "card hub-toolbar";
        bar.innerHTML = `
            <div class="hub-search">
                <input type="search" id="topicSearch" placeholder="Search ${hubTopics.length} topics by name, category or subtopic…"
                       aria-label="Search topics" autocomplete="off" value="${escapeAttr(hubState.query)}">
                <button type="button" id="topicSearchClear" class="hub-search-clear" aria-label="Clear search"
                        ${hubState.query ? "" : "hidden"}>✕</button>
            </div>
            <div class="hub-filter-row">
                <div class="hub-chips" role="group" aria-label="Filter by status">
                    ${STATUS_CHIPS.filter(c => counts[c.key]).map(c => `
                        <button type="button" class="hub-chip hub-chip-${c.key}" data-status="${c.key}" aria-pressed="false">
                            ${c.label} <span class="hub-chip-n">${counts[c.key]}</span>
                        </button>`).join("")}
                </div>
                <label class="hub-sort">Sort
                    <select id="topicSort" aria-label="Sort topics">
                        <option value="attention">Needs practice first</option>
                        <option value="name">Name A–Z</option>
                        <option value="score">Highest average</option>
                        <option value="recent">Recently attempted</option>
                    </select>
                </label>
            </div>
            <div class="hub-count" id="topicCount" role="status" aria-live="polite"></div>`;

        const input = bar.querySelector("#topicSearch");
        const clear = bar.querySelector("#topicSearchClear");
        let timer = null;
        input.addEventListener("input", () => {
            clear.hidden = !input.value;
            clearTimeout(timer);
            timer = setTimeout(() => { hubState.query = input.value; hubState.shown = PAGE_SIZE; renderHubList(); }, 150);
        });
        input.addEventListener("keydown", e => { if (e.key === "Escape") clear.click(); });
        clear.addEventListener("click", () => {
            input.value = ""; clear.hidden = true; hubState.query = ""; hubState.shown = PAGE_SIZE;
            renderHubList(); input.focus();
        });
        bar.querySelectorAll(".hub-chip").forEach(chip => chip.addEventListener("click", () => {
            // Click a status to filter to it; click it again to show everything.
            hubState.status = hubState.status === chip.dataset.status ? null : chip.dataset.status;
            hubState.shown = PAGE_SIZE;
            renderHubList();
        }));
        bar.querySelector("#topicSort").addEventListener("change", e => {
            hubState.sort = e.target.value; hubState.shown = PAGE_SIZE; renderHubList();
        });
        return bar;
    }

    function renderHubList() {
        const matches = visibleTopics();
        const grid = document.getElementById("topicGrid");
        const more = document.getElementById("topicMore");
        grid.innerHTML = "";
        more.innerHTML = "";

        document.querySelectorAll(".hub-chip").forEach(chip => {
            const on = chip.dataset.status === hubState.status;
            chip.classList.toggle("is-on", on);
            chip.setAttribute("aria-pressed", on ? "true" : "false");
        });
        const count = document.getElementById("topicCount");
        if (count) count.textContent = filtersActive()
            ? `${matches.length} of ${hubTopics.length} topics match`
            : `${hubTopics.length} topics`;

        if (!matches.length) {
            more.innerHTML = `<div class="card hub-empty">
                    <div class="u-font-weight-margin-botto-fab42">No topics match${hubState.query.trim() ? ` “${escapeHtml(hubState.query.trim())}”` : ""}.</div>
                    <div class="muted u-margin-bottom-12px">Try a different word, or clear the filters.</div>
                    <button type="button" class="btn" id="clearFilters">Clear filters</button>
                </div>`;
            document.getElementById("clearFilters").onclick = () => {
                hubState.query = ""; hubState.status = null; hubState.shown = PAGE_SIZE;
                const input = document.getElementById("topicSearch");
                if (input) { input.value = ""; document.getElementById("topicSearchClear").hidden = true; }
                renderHubList();
            };
            return;
        }

        matches.slice(0, hubState.shown).forEach(t => grid.appendChild(renderTopicCard(t)));
        const left = matches.length - hubState.shown;
        if (left > 0) {
            more.innerHTML = `<button type="button" class="btn hub-more" id="showMore">Show ${Math.min(PAGE_SIZE, left)} more · ${left} left</button>`;
            document.getElementById("showMore").onclick = () => { hubState.shown += PAGE_SIZE; renderHubList(); };
        }
        initDescriptionToggles();
    }

    function renderTopicCard(topic) {
        // No attempts yet means no score: show "New", not "Needs practice at 0%".
        const tried = topic.mastery !== null;
        const isWeak = tried && topic.mastery < WEAK_THRESHOLD;
        const color = tried ? masteryColor(topic.mastery) : "blue";
        const motiv = tried ? motivation(topic.mastery) : { text: "✨ Ready to start", cls: "motiv-good" };
        const scoreColor = tried ? `score-${masteryColor(topic.lastScore)}` : "";
        const summaryId = `ai-summary-${topic.id}`;

        const card = document.createElement("div");
        card.className = isWeak ? "card weak-topic" : "card";
        card.dataset.topicId = topic.id;
        card.dataset.topicName = topic.name;
        card.dataset.topicDesc = topic.description;

        const head = document.createElement("div");
        head.className = "card-head";
        head.innerHTML = `
            <h3>${escapeHtml(topic.name)}</h3>
            <div class="topic-status-actions">
                ${!tried ? `<span class="tag">New</span>` : isWeak ? `<span class="badge warn">Needs practice</span>` : `<span class="tag good">${topicBand(topic.mastery).label}</span>`}
                <button class="topic-delete-btn u-font-size-padding-a7937" data-topic="${escapeAttr(topic.name)}" title="Delete this topic"
                   >
                    🗑 Delete
                </button>
            </div>`;
        head.querySelector(".topic-delete-btn").onclick = () => deleteTopic(topic.name);
        card.appendChild(head);

        const inner = document.createElement("div");
        inner.className = "topic-card-inner";

        const left = document.createElement("div");
        left.className = "topic-card-left";

        const descWrap = document.createElement("div");
        descWrap.className = "topic-desc-wrap";
        descWrap.style.marginBottom = "10px";

        const desc = document.createElement("div");
        desc.className = "muted topic-desc-clamp";
        desc.textContent = topic.description;
        descWrap.appendChild(desc);

        const descToggle = document.createElement("button");
        descToggle.type = "button";
        descToggle.className = "topic-desc-toggle";
        descToggle.textContent = "Show more";
        descToggle.onclick = () => {
            const nowExpanded = desc.classList.toggle("topic-desc-expanded");
            desc.classList.toggle("topic-desc-clamp", !nowExpanded);
            descToggle.textContent = nowExpanded ? "Show less" : "Show more";
        };
        descWrap.appendChild(descToggle);

        left.appendChild(descWrap);

        const progressBlock = document.createElement("div");
        progressBlock.className = "progress-block";
        progressBlock.innerHTML = `
                <div class="prog-row"><span>Average score</span><span class="muted">${tried ? topic.mastery + "%" : "Not attempted yet"}</span></div>
                <div class="bar"><div class="bar-fill bar-fill-${color}" style="width:${tried ? topic.mastery : 0}%"></div></div>`;
        left.appendChild(progressBlock);

        // Concept progress line ("3 need practice · 12 got it"); filled in by concept-progress.js once the summary loads.
        const conceptSlot = document.createElement("div");
        conceptSlot.setAttribute("data-cp-inline", topic.name);
        left.appendChild(conceptSlot);

        const statusRow = document.createElement("div");
        statusRow.className = "topic-status-row";
        statusRow.innerHTML = `
                <span class="topic-motivation ${motiv.cls}">${motiv.text}</span>
                <div class="topic-last-score">
                    <span class="topic-last-score-val ${scoreColor}">${tried ? topic.lastScore + "%" : "—"}</span>
                    <span>Last score · ${topic.lastAttempt}</span>
                </div>`;
        left.appendChild(statusRow);

        if (isWeak && topic.subtopics.length > 0) {
            const label = document.createElement("div");
            label.className = "muted";
            label.style.marginTop = "12px";
            label.textContent = "Suggested topics to review:";
            left.appendChild(label);
            const ul = document.createElement("ul");
            ul.className = "subtopics";
            topic.subtopics.forEach(s => { const li = document.createElement("li"); li.textContent = s; ul.appendChild(li); });
            left.appendChild(ul);
        }

        const cta = document.createElement("div");
        cta.className = "cta-row";
        cta.style.marginTop = "14px";
        if (topic.baselineLocked) {
            cta.innerHTML = `
    <a class="btn primary start-quiz-link" href="quizpage.html" data-topic="${escapeAttr(topic.name)}" data-difficulty="${escapeAttr(topic.difficulty)}">
        ▶ Start Quiz
    </a>
    <a class="btn ghost" href="${topic.reviewUrl}">📖 Review</a>`;
        } else
        cta.innerHTML = `
    <a class="btn primary adapted-quiz-link" href="#" data-topic="${escapeAttr(topic.name)}" data-difficulty="${escapeAttr(topic.difficulty)}">
        🧠 Start Adapted Quiz
    </a>
    <a class="btn ghost start-quiz-link" href="quizpage.html" data-topic="${escapeAttr(topic.name)}" data-difficulty="${escapeAttr(topic.difficulty)}" data-retake="true">
        🔁 Retake Last
    </a>
    <button class="btn ghost targeted-quiz-link u-border-color-5fdc3" data-topic="${escapeAttr(topic.name)}"
       >
        🎯 Target Problems
    </button>
    <a class="btn ghost" href="${topic.reviewUrl}">📖 Review</a>`;
        left.appendChild(cta);

        const right = document.createElement("div");
        right.className = "topic-card-right";
        right.innerHTML = `
                <button type="button" class="topic-ai-label subtopics-toggle" data-content-id="${summaryId}" aria-expanded="false">
                    <span>📚 Subtopics Covered</span>
                    <span class="subtopics-toggle-icon">▾</span>
                </button>
                <div class="topic-ai-text loading" id="${summaryId}" hidden>Loading subtopics...</div>
                <div class="topic-cat-label">🏷 Category</div>
                <div class="topic-cat-placeholder" id="${summaryId}-cat">Detecting category...</div>`;

        inner.appendChild(left);
        inner.appendChild(right);
        card.appendChild(inner);

        // Deferred one tick: with the caches primed the summary is available at once, and the card must be attached to
        // the page before it can be filled in (the elements are looked up by id).
        queueMicrotask(() => fetchTopicSummary(topic.name, summaryId));

        return card;
    }

    const summaryCache = {};
    const categoryCache = {};

    function renderCategoryInto(elementId, primaryCategory, subCategory) {
        const el = document.getElementById(elementId);
        if (!el) return;
        if (!primaryCategory || (primaryCategory === "General / Other" && !subCategory)) {
            el.textContent = primaryCategory || "Uncategorized";
            el.classList.add("topic-cat-placeholder");
            return;
        }
        el.classList.remove("topic-cat-placeholder");
        el.innerHTML = `<span class="cat-count u-margin-left-0">${escapeHtml(primaryCategory)}</span>` +
            (subCategory ? `<div class="u-margin-top-font-size-e1fa9">${escapeHtml(subCategory)}</div>` : "");
    }

    function renderSubtopicsInto(elementId, subtopics, fallbackText) {
        const el = document.getElementById(elementId);
        if (!el) return;
        el.classList.remove("loading");
        if (Array.isArray(subtopics) && subtopics.length > 0) {
            el.className = "topic-subtopics-list";
            el.innerHTML = subtopics.map(s => `<span class="subtopic-pill">${escapeHtml(s)}</span>`).join("");
        } else {
            el.className = "topic-ai-text";
            el.textContent = fallbackText || "No subtopics extracted yet — upload a handout to generate them.";
        }
    }

    async function fetchTopicSummary(topicName, elementId) {
        const catElementId = `${elementId}-cat`;
        if (summaryCache[topicName]) {
            renderSubtopicsInto(elementId, summaryCache[topicName].subtopics, summaryCache[topicName].fallback);
            if (categoryCache[topicName]) renderCategoryInto(catElementId, categoryCache[topicName].primaryCategory, categoryCache[topicName].subCategory);
            return;
        }
        try {
            const data = await apiFetch("/api/materials");
            const materials = data.materials || [];
            const match = materials.find(m => m.topic && m.topic.toLowerCase() === topicName.toLowerCase());
            const subtopics = match?.subtopics || [];
            const fallback = match?.topicSummary || "No summary yet — upload a handout for this topic to generate one.";
            summaryCache[topicName] = { subtopics, fallback };
            renderSubtopicsInto(elementId, subtopics, fallback);

            const primaryCategory = match?.primaryCategory || null;
            const subCategory = match?.subCategory || null;
            categoryCache[topicName] = { primaryCategory, subCategory };
            renderCategoryInto(catElementId, primaryCategory, subCategory);
        } catch {
            const el = document.getElementById(elementId);
            if (el) { el.textContent = "Subtopics unavailable."; el.classList.remove("loading"); }
            renderCategoryInto(catElementId, null, null);
        }
    }

    function renderEmptyCard(cat) {
        const wrapper = document.createElement("div");
        wrapper.className = "card";
        wrapper.innerHTML = `
                <div class="card-head"><h3>${escapeHtml(cat.name)}</h3></div>
                <div class="divider"></div>
                <div class="muted">${escapeHtml(cat.overview)}</div>`;
        return wrapper;
    }

    async function loadAssignedHandouts() {
        const host = document.getElementById("assignedHandouts");
        if (!host) return;
        try {
            const resp = await apiFetch("/api/assigned-handouts");
            const all = resp.handouts || [];
            const pending = all.filter(h => h.status === "PENDING");
            const preparing = all.filter(h => h.status === "PREPARING");
            if (!pending.length && !preparing.length) { host.innerHTML = ""; return; }
            host.innerHTML = `
                <div class="card assigned-card">
                    <div class="card-head"><h3>📎 Handouts assigned to you${pending.length ? ` <span class="badge warn">${pending.length} waiting</span>` : ""}</h3></div>
                    ${preparing.length ? `<div class="muted u-margin-bottom-8px">⏳ Your quiz is being prepared (${preparing.map(h => escapeHtml(h.topic)).join(", ")}). This usually takes 1–2 minutes. Refresh this page and it will appear in your topics below.</div>` : ""}
                    ${pending.length ? `<div class="muted u-margin-bottom-8px">Open a handout to read it. When you're ready, press the send button on that page to start your quiz.</div>` : ""}
                    ${pending.map(h => `
                        <div class="assigned-row">
                            <div>
                                <div class="assigned-row-name">${escapeHtml(h.topic)}</div>
                                <div class="assigned-row-meta">${escapeHtml(h.filename || "")} · ${formatSize(h.sizeBytes)}</div>
                            </div>
                            <a class="btn primary" href="${escapeAttr(h.openUrl)}">📖 Open handout</a>
                        </div>`).join("")}
                </div>`;
        } catch (e) {
            host.innerHTML = "";
        }
    }

    function renderQuizHub(data) {
        hubTopics = data.categories.flatMap(c => c.topics || []);
        const container = document.getElementById("quizContent");
        container.innerHTML = "";

        if (!hubTopics.length) {
            container.appendChild(renderEmptyCard(data.categories[0] || { name: "No Topics Yet", overview: "" }));
            return;
        }

        const hasToolbar = hubTopics.length >= TOOLBAR_MIN;
        // Links such as quizhub.html?focus=<topic> (from the concept cards) land with that topic searched.
        const focus = new URLSearchParams(location.search).get("focus");
        if (hasToolbar && focus) hubState.query = focus;
        if (hasToolbar) container.appendChild(renderToolbar());

        const grid = document.createElement("div");
        grid.id = "topicGrid";
        grid.className = "grid-2";
        container.appendChild(grid);
        const more = document.createElement("div");
        more.id = "topicMore";
        container.appendChild(more);

        const sort = document.getElementById("topicSort");
        if (sort) sort.value = hubState.sort;
        renderHubList();
    }

    /**
     * Shows the "Show more" toggle only on descriptions whose text actually
     * overflows the 4-line clamp. Must run after the cards are attached to
     * the DOM (scrollHeight/clientHeight are only meaningful post-layout).
     */
    function initDescriptionToggles() {
        document.querySelectorAll(".topic-desc-wrap").forEach(wrap => {
            const desc = wrap.querySelector(".topic-desc-clamp");
            const toggle = wrap.querySelector(".topic-desc-toggle");
            if (!desc || !toggle) return;
            const isOverflowing = desc.scrollHeight > desc.clientHeight + 1;
            toggle.style.display = isOverflowing ? "inline-block" : "none";
        });
    }

    async function loadLiveTopicMastery() {
        try {
            const [dashData, materialsData, assignedData] = await Promise.all([
                apiFetch('/api/dashboard'),
                apiFetch('/api/materials').catch(() => ({ materials: [] })),
                IS_PARTICIPANT
                    ? apiFetch('/api/assigned-handouts').catch(() => ({ handouts: [] }))
                    : Promise.resolve({ handouts: [] })
            ]);

            // A participant's FIRST assigned handout is the shared baseline set: until they have taken
            // that quiz once, only the plain "Start Quiz" is offered (no Adapted Quiz / Target Problems).
            const normTopic = t => String(t || '').trim().toLowerCase();
            const assignedList = (assignedData && assignedData.handouts) || [];
            const firstAssigned = assignedList.length
                ? assignedList.reduce((a, b) => (Number(b.id) < Number(a.id) ? b : a))
                : null;
            const baselineTopic = firstAssigned ? normTopic(firstAssigned.topic) : null;

            const masteryMap = {};
            // topicMasteryAll is every topic; topicMastery is trimmed to 10 for the dashboard.
            const masteryList = dashData.topicMasteryAll || dashData.topicMastery;
            if (Array.isArray(masteryList)) {
                masteryList.forEach(t => {
                    masteryMap[t.name] = Number(t.mastery || 0);
                });
            }

            const lastScoreMap = {};
            const lastDateMap = {};
            const lastDifficultyMap = {};
            (dashData.quizHistory || []).forEach(h => {
                if (!(h.topic in lastScoreMap)) {
                    lastScoreMap[h.topic] = h.score;
                    lastDateMap[h.topic] = h.date;
                    lastDifficultyMap[h.topic] = h.difficulty;
                }
            });

            const materials = (materialsData.materials || []);

            const allTopicNames = new Set([
                ...materials.map(m => m.topic),
                ...Object.keys(masteryMap)
            ]);

            if (allTopicNames.size === 0) {
                quizData.categories = [{ id: 'empty', name: 'No Topics Yet', section: 'Adaptive Learning', overview: IS_PARTICIPANT ? 'Your researcher assigns your handouts. Open the one waiting above to begin.' : 'Upload a handout to get started.', topics: [] }];
                return;
            }

            const summaryMap = {};
            materials.forEach(m => { summaryMap[m.topic] = m.topicSummary; });

            const liveTopics = [];
            allTopicNames.forEach(name => {
                const mastery   = (name in masteryMap) ? masteryMap[name] : null;   // null = never attempted
                const lastScore = lastScoreMap[name] ?? mastery;
                const lastDate  = lastDateMap[name] ?? 'Not attempted yet';
                // Material details come from the list already fetched above. Priming the caches here means the cards
                // do not each re-fetch /api/materials, which adds up with dozens of topics, and lets search see them.
                const mat = materials.find(m => m.topic && m.topic.toLowerCase() === name.toLowerCase());
                const subtopics = (mat && mat.subtopics) || [];
                summaryCache[name] = { subtopics, fallback: (mat && mat.topicSummary) || "No summary yet — upload a handout for this topic to generate one." };
                categoryCache[name] = { primaryCategory: (mat && mat.primaryCategory) || null, subCategory: (mat && mat.subCategory) || null };
                liveTopics.push({
                    searchText: [name, mat && mat.topicSummary, mat && mat.primaryCategory, mat && mat.subCategory, ...subtopics]
                        .filter(Boolean).join(" ").toLowerCase(),
                    id: 'topic-' + liveTopics.length,
                    name,
                    description: summaryMap[name] || 'Upload a handout to generate quiz questions for this topic.',
                    mastery,
                    lastScore,
                    lastAttempt: lastDate,
                    // Difficulty of the student's most recent attempt on this topic — "Retake Last"
                    // must request questions at THIS difficulty, not a hardcoded default. The
                    // question bank for a topic is regenerated at a single difficulty at a time
                    // (e.g. by Adapted Quiz), so requesting the wrong one returns zero questions.
                    difficulty: lastDifficultyMap[name] || 'Easy',
                    baselineLocked: IS_PARTICIPANT && baselineTopic !== null
                        && normTopic(name) === baselineTopic && !(name in lastScoreMap),
                    subtopics: [],
                    quizUrl: 'quizpage.html',
                    reviewUrl: 'learninghub.html'
                });
            });

            quizData.categories = [{
                id: 'cat-1',
                name: 'Your Topics',
                section: 'Adaptive Learning',
                overview: 'Topics based on your uploaded materials and quiz performance.',
                topics: liveTopics
            }];

        } catch (err) {
            if (err && err.status === 401) { window.location.href = "/login.html"; return; }
            quizData.categories = [{
                id: 'empty',
                name: 'No Topics Yet',
                section: 'Adaptive Learning',
                overview: "We couldn't load your topics right now. Please refresh or try again shortly.",
                topics: []
            }];
        }
    }

    async function initQuizHub() {
        try {
            await meReady;
            await loadLiveTopicMastery();
            renderQuizHub(quizData);
        } finally {
            revealPage();
        }
    }

    initQuizHub();

    document.addEventListener("click", function(e) {
        const link = e.target.closest(".start-quiz-link");
        if (!link) return;
        e.preventDefault();
        const topic = link.dataset.topic;
        if (!topic) return;
        const difficulty = link.dataset.difficulty || 'Easy';
        sessionStorage.setItem("quizTopic", topic);
        sessionStorage.setItem("quizDifficulty", difficulty);
        sessionStorage.setItem("isAdaptedQuiz", "false");
        window.location.href = `quizpage.html?topic=${encodeURIComponent(topic)}&difficulty=${encodeURIComponent(difficulty)}`;
    });

    document.addEventListener("click", function(e) {
        const link = e.target.closest(".adapted-quiz-link");
        if (!link) return;
        e.preventDefault();
        const topic = link.dataset.topic;
        if (!topic) return;
        ReplaceWarning.confirm("adapted", topic).then(ok => { if (ok) runAdaptedQuiz(topic); });
    });

    document.addEventListener("click", async function(e) {
        const btn = e.target.closest(".targeted-quiz-link");
        if (!btn) return;
        e.preventDefault();
        if (btn.disabled) return;
        const topic = btn.dataset.topic;
        if (!topic) return;
        btn.disabled = true;   // locked while the warning is open, so a double tap can't stack two dialogs
        if (!(await ReplaceWarning.confirm("targeted", topic))) { btn.disabled = false; return; }
        const result = await ProgressLog.run({
            title: "🎯 Building Target Problems",
            topic,
            endpoint: "/api/quiz/targeted"
        });
        if (result.success) {
            sessionStorage.setItem("quizTopic", topic);
            sessionStorage.setItem("quizDifficulty", "Targeted");
            sessionStorage.setItem("isAdaptedQuiz", "false"); // targeted is NOT adapted
            setTimeout(() => { window.location.href = result.quizUrl; }, 1500);
        } else {
            btn.disabled = false;
        }
    });

    document.addEventListener("click", function(e) {
        const toggleBtn = e.target.closest(".subtopics-toggle");
        if (!toggleBtn) return;
        const content = document.getElementById(toggleBtn.dataset.contentId);
        if (!content) return;
        const opening = content.hidden;
        content.hidden = !opening;
        toggleBtn.setAttribute("aria-expanded", opening ? "true" : "false");
        toggleBtn.classList.toggle("open", opening);
    });

    async function runAdaptedQuiz(topic) {
        const result = await ProgressLog.run({
            title: "🧠 Building Adapted Quiz",
            topic,
            endpoint: "/api/quiz/adapted"
        });
        if (result.success) {
            sessionStorage.setItem("isAdaptedQuiz", "true");
            setTimeout(() => { window.location.href = result.quizUrl; }, 1500);
        }
    }

    document.querySelectorAll(".logout").forEach(link => {
        link.addEventListener("click", async function(e) {
            e.preventDefault();
            try { await apiFetch("/logout", { method: "POST" }); } catch (err) {}
            window.location.href = "/login.html";
        });
    });

    const drawer = document.getElementById("uploadDrawer");

    // The upload form itself (file picking, replace warning, progress, cancel-on-leave, uploaded-materials list) is the
    // shared widget in material-upload.js. The Learning Hub mounts the very same one, so the two cannot differ.
    const uploader = MaterialUpload.mount(document.getElementById("materialUploadHost"), {
        onUploaded: () => initQuizHub()   // an upload that doesn't redirect still shows up in the topic list
    });

    function openUploadDrawer() {
        drawer.classList.add("open");
        uploader.reload();
    }

    document.getElementById("drawerClose").onclick = () => drawer.classList.remove("open");

    document.addEventListener("click", function(e) {
        if (uploader.isBusy()) return; // subcategory taps, search, etc. must never disturb an active upload
        if (drawer.classList.contains("open") && !drawer.contains(e.target) && e.target.id !== "openDrawerBtn" && !e.target.closest("[onclick='openUploadDrawer()']")) {
            drawer.classList.remove("open");
        }
    });

    function formatSize(bytes) {
        if (!bytes) return "0 KB";
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function deleteTopic(topic) {
        const existing = document.getElementById('deleteModal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'deleteModal';
        modal.style.cssText = `
        position:fixed; inset:0; background:rgba(15,23,42,0.55);
        z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;
    `;
        modal.innerHTML = `
        <div class="u-background-border-radius-2c89c">
            <div class="u-font-size-margin-bottom-a1b96">🗑️</div>
            <div class="u-font-size-font-weight-941e9">
                Delete "${escapeHtml(topic)}"?
            </div>
            <div class="u-font-size-color-6d256">
                This will permanently delete all quiz questions, attempt history,
                and uploaded material for this topic. This cannot be undone.
            </div>
            <div class="u-display-gap-871a8">
                <button class="u-flex-padding-90f8a" id="cancelDelete"
                   >
                    Cancel
                </button>
                <button class="u-flex-padding-45f2c" id="confirmDelete"
                   >
                    Yes, Delete
                </button>
            </div>
            <div class="u-display-margin-top-b6999" id="deleteStatus"></div>
        </div>
    `;

        document.body.appendChild(modal);

        document.getElementById('cancelDelete').onclick = () => modal.remove();
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });

        document.getElementById('confirmDelete').onclick = async () => {
            const confirmBtn = document.getElementById('confirmDelete');
            const status = document.getElementById('deleteStatus');
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Deleting...';
            status.style.display = 'none';

            try {
                await apiFetch(`/api/topics?name=${encodeURIComponent(topic)}`, { method: 'DELETE' });

                try {
                    const cached = JSON.parse(localStorage.getItem("quizResults") || "null");
                    if (cached && cached.topic && cached.topic.toLowerCase() === topic.toLowerCase()) {
                        localStorage.removeItem("quizResults");
                    }
                } catch (e) {}

                modal.remove();
                await uploader.reload();
                await initQuizHub();
            } catch (err) {
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'Yes, Delete';
                status.style.display = 'block';
                status.style.background = '#fef2f2';
                status.style.border = '1px solid #fecaca';
                status.style.color = '#991b1b';
                status.textContent = '❌ ' + (err.message || 'Delete failed. Try again.');
            }
        };
    }

</script>
<script src="mobile-nav.js"></script>
<script src="ai-info.js"></script>
