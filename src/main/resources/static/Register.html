<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="login.css" rel="stylesheet">
</head>
<body>
<div class="loginbox">
    <div class="logincard">
        <h2>Create Account</h2>
        <p>Register to access your dashboard</p>
        <form>
            <label for="fullName">Full Name:</label><br>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="new-password"><br>

            <div id="pwMeterTrack" class="pw-meter-track">
                <div id="pwMeterFill" class="pw-meter-fill"></div>
            </div>
            <div id="pwMeterLabel" class="pw-meter-label">&nbsp;</div>

            <ul id="pwRequirements" class="pw-requirements">
                <li data-rule="length">At least 8 characters</li>
                <li data-rule="classes">Contains 3 of: uppercase, lowercase, number, symbol</li>
                <li data-rule="common">Not a commonly used password</li>
            </ul>

            <br>
            <button type="submit">Register</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>

    </div>
</div>
<script src="api.js"></script>
<script src="register.js"></script>
<script src="password-strength.js"></script>
</body>
</html>
