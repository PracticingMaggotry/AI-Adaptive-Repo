<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="login.css" rel="stylesheet">
    <style>
        /* ── OTP panel ─────────────────────────────────── */
        #otpPanel { display: none; }

        .otp-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 20px 0 10px;
        }

        .otp-digit {
            width: 44px;
            height: 54px;
            border-radius: 10px;
            border: 2px solid #1e293b;
            background: #020617;
            color: #e5e7eb;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            outline: none;
            transition: border-color 0.15s;
            /* Override the global input margin so the boxes sit flush */
            margin: 0 !important;
        }

        .otp-digit:focus {
            border-color: #38bdf8;
        }

        .otp-digit.error {
            border-color: #ef4444;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-4px); }
            40%      { transform: translateX(4px); }
            60%      { transform: translateX(-3px); }
            80%      { transform: translateX(3px); }
        }

        .otp-timer {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 14px;
            min-height: 18px;
        }

        .otp-timer.expiring {
            color: #f87171;
            font-weight: 700;
        }

        .otp-hint {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 8px;
        }

        #resendBtn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 13px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
            display: inline;
            text-decoration: underline;
        }

        #resendBtn:disabled {
            color: #475569;
            cursor: default;
            text-decoration: none;
        }

        #backToRegister {
            background: none;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }

        #backToRegister:hover {
            border-color: #38bdf8;
            color: #e5e7eb;
        }

        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px solid #334155;
        }

        .step-dot.active {
            background: #38bdf8;
            border-color: #38bdf8;
        }

        .step-dot.done {
            background: #22c55e;
            border-color: #22c55e;
        }

        .email-chip {
            display: inline-block;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            color: #38bdf8;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="loginbox">
    <div class="logincard">

        <!-- ── Step indicator ── -->
        <div class="step-indicator" id="stepIndicator">
            <div class="step-dot active" id="step1dot"></div>
            <div class="step-dot" id="step2dot"></div>
        </div>

        <!-- ══════════════════════════════════════
             PANEL 1 — Registration form
        ══════════════════════════════════════ -->
        <div id="registerPanel">
            <h2>Create Account</h2>
            <p>Register to access your dashboard</p>

            <form id="registerForm">
                <label for="fullName">Full Name:</label><br>
                <input type="text" id="fullName" name="fullName"
                       placeholder="Enter your full name" required><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required><br>

                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required
                       autocomplete="new-password"><br>

                <div id="pwMeterTrack" class="pw-meter-track">
                    <div id="pwMeterFill" class="pw-meter-fill"></div>
                </div>
                <div id="pwMeterLabel" class="pw-meter-label">&nbsp;</div>

                <ul id="pwRequirements" class="pw-requirements">
                    <li data-rule="length">At least 8 characters</li>
                    <li data-rule="classes">Contains 3 of: uppercase, lowercase, number, symbol</li>
                    <li data-rule="common">Not a commonly used password</li>
                </ul>

                <br>
                <button type="submit" id="registerBtn">Send Verification Code</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        </div>

        <!-- ══════════════════════════════════════
             PANEL 2 — OTP entry
        ══════════════════════════════════════ -->
        <div id="otpPanel">
            <h2>Check your email 📬</h2>
            <p id="otpSubtitle">We sent a 6-digit code to</p>
            <p style="text-align:center; margin-bottom:16px;">
                <span class="email-chip" id="sentEmailLabel"></span>
            </p>

            <div class="otp-inputs" id="otpInputs">
                <input class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" />
                <input class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                <input class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                <input class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                <input class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" />
                <input class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" />
            </div>

            <div class="otp-timer" id="otpTimer">Code expires in 5:00</div>

            <button id="verifyBtn" style="width:100%; margin-bottom:8px;">Verify &amp; Create Account</button>

            <div id="otpMessage" style="display:none; margin-bottom:8px;
                 padding:10px 14px; border-radius:8px; font-size:0.85rem;"></div>

            <div class="otp-hint">
                Didn't receive it?
                <button id="resendBtn" disabled>Resend code</button>
            </div>

            <button id="backToRegister">← Change email / details</button>
        </div>

    </div>
</div>

<script src="api.js"></script>
<script src="password-strength.js"></script>
<script>
    (function () {
        // ── State ──────────────────────────────────────────────────────────
        let pendingEmail = "";
        let timerHandle  = null;

        const registerPanel = document.getElementById("registerPanel");
        const otpPanel      = document.getElementById("otpPanel");
        const step1dot      = document.getElementById("step1dot");
        const step2dot      = document.getElementById("step2dot");
        const verifyBtn     = document.getElementById("verifyBtn");
        const resendBtn     = document.getElementById("resendBtn");
        const otpTimer      = document.getElementById("otpTimer");
        const otpMessage    = document.getElementById("otpMessage");
        const digits        = Array.from(document.querySelectorAll(".otp-digit"));

        // ── Panel transitions ──────────────────────────────────────────────
        function showOtpPanel(email) {
            pendingEmail = email;
            document.getElementById("sentEmailLabel").textContent = email;

            registerPanel.style.display = "none";
            otpPanel.style.display      = "block";

            step1dot.classList.remove("active");
            step1dot.classList.add("done");
            step2dot.classList.add("active");

            clearOtp();
            startTimer(5 * 60);
            digits[0].focus();
            startResendCooldown(30);
        }

        function showRegisterPanel() {
            stopTimer();
            otpPanel.style.display      = "none";
            registerPanel.style.display = "block";

            step2dot.classList.remove("active");
            step1dot.classList.remove("done");
            step1dot.classList.add("active");
        }

        // ── OTP digit inputs ───────────────────────────────────────────────
        digits.forEach((input, i) => {
            input.addEventListener("input", (e) => {
                // Accept only digits; strip anything else immediately.
                input.value = input.value.replace(/\D/g, "").slice(-1);
                if (input.value && i < digits.length - 1) digits[i + 1].focus();
            });

            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !input.value && i > 0) {
                    digits[i - 1].value = "";
                    digits[i - 1].focus();
                }
                if (e.key === "Enter") verifyOtp();
            });

            // Handle paste on the first box — fills all 6 digits at once.
            input.addEventListener("paste", (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData)
                    .getData("text").replace(/\D/g, "").slice(0, 6);
                pasted.split("").forEach((ch, j) => {
                    if (digits[j]) digits[j].value = ch;
                });
                const lastFilled = Math.min(pasted.length, digits.length) - 1;
                if (lastFilled >= 0) digits[lastFilled].focus();
            });
        });

        function getOtp() {
            return digits.map(d => d.value).join("");
        }

        function clearOtp() {
            digits.forEach(d => {
                d.value = "";
                d.classList.remove("error");
            });
        }

        function shakeDigits() {
            digits.forEach(d => {
                d.classList.remove("error");
                // Force reflow so the animation restarts if already applied.
                void d.offsetWidth;
                d.classList.add("error");
            });
            setTimeout(() => digits.forEach(d => d.classList.remove("error")), 400);
        }

        // ── Timer ──────────────────────────────────────────────────────────
        function startTimer(seconds) {
            stopTimer();
            let remaining = seconds;
            updateTimerDisplay(remaining);

            timerHandle = setInterval(() => {
                remaining--;
                updateTimerDisplay(remaining);
                if (remaining <= 0) {
                    stopTimer();
                    otpTimer.textContent = "Code expired. Please register again.";
                    otpTimer.classList.add("expiring");
                    verifyBtn.disabled = true;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
        }

        function updateTimerDisplay(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            otpTimer.textContent = `Code expires in ${m}:${String(s).padStart(2, "0")}`;
            otpTimer.classList.toggle("expiring", seconds <= 60);
        }

        // ── Resend cooldown ────────────────────────────────────────────────
        function startResendCooldown(seconds) {
            resendBtn.disabled = true;
            let remaining = seconds;
            resendBtn.textContent = `Resend code (${remaining}s)`;

            const handle = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(handle);
                    resendBtn.disabled = false;
                    resendBtn.textContent = "Resend code";
                } else {
                    resendBtn.textContent = `Resend code (${remaining}s)`;
                }
            }, 1000);
        }

        // ── OTP message banner ─────────────────────────────────────────────
        function showOtpMsg(text, type) {
            otpMessage.textContent = text;
            otpMessage.style.display = "block";
            if (type === "error") {
                otpMessage.style.background = "#fef2f2";
                otpMessage.style.color      = "#991b1b";
                otpMessage.style.border     = "1px solid #fecaca";
            } else {
                otpMessage.style.background = "#f0fdf4";
                otpMessage.style.color      = "#065f46";
                otpMessage.style.border     = "1px solid #bbf7d0";
            }
        }

        function clearOtpMsg() {
            otpMessage.style.display = "none";
            otpMessage.textContent   = "";
        }

        // ── Step 1 — submit registration form ──────────────────────────────
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const btn      = document.getElementById("registerBtn");
            const fullName = document.getElementById("fullName").value.trim();
            const email    = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            btn.disabled    = true;
            btn.textContent = "Sending code…";

            try {
                const params = new URLSearchParams({ fullName, email, password });
                const data = await apiFetch("/register", {
                    method:  "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body:    params
                });

                if (data.success && data.requiresVerification) {
                    showOtpPanel(data.email || email);
                } else {
                    // Field-level error — stay on form, show message.
                    let msgEl = document.querySelector("#registerPanel .error-msg");
                    if (!msgEl) {
                        msgEl = document.createElement("div");
                        msgEl.className = "error-msg";
                        msgEl.style.cssText = "margin-top:12px; padding:10px 14px; border-radius:8px; font-size:0.85rem; background:#fef2f2; color:#991b1b; border:1px solid #fecaca;";
                        document.getElementById("registerForm").appendChild(msgEl);
                    }
                    msgEl.textContent = data.message || "Registration failed.";
                }
            } catch (err) {
                let msgEl = document.querySelector("#registerPanel .error-msg");
                if (!msgEl) {
                    msgEl = document.createElement("div");
                    msgEl.className = "error-msg";
                    msgEl.style.cssText = "margin-top:12px; padding:10px 14px; border-radius:8px; font-size:0.85rem; background:#fef2f2; color:#991b1b; border:1px solid #fecaca;";
                    document.getElementById("registerForm").appendChild(msgEl);
                }
                msgEl.textContent = err.message || "Could not connect. Please try again.";
            } finally {
                btn.disabled    = false;
                btn.textContent = "Send Verification Code";
            }
        });

        // ── Step 2 — verify OTP ────────────────────────────────────────────
        async function verifyOtp() {
            const otp = getOtp();
            if (otp.length < 6) {
                shakeDigits();
                showOtpMsg("Please enter all 6 digits.", "error");
                return;
            }

            clearOtpMsg();
            verifyBtn.disabled    = true;
            verifyBtn.textContent = "Verifying…";

            try {
                const params = new URLSearchParams({ email: pendingEmail, otp });
                const data = await apiFetch("/verify-email", {
                    method:  "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body:    params
                });

                if (data.success) {
                    stopTimer();
                    showOtpMsg("✓ " + (data.message || "Account created!"), "success");
                    step2dot.classList.remove("active");
                    step2dot.classList.add("done");
                    setTimeout(() => { window.location.href = "/login.html"; }, 1400);
                } else if (data.expired) {
                    // Token expired — send them back to re-register.
                    showOtpMsg(data.message || "Code expired. Please register again.", "error");
                    setTimeout(showRegisterPanel, 2500);
                } else {
                    shakeDigits();
                    clearOtp();
                    digits[0].focus();
                    showOtpMsg(data.message || "Incorrect code. Try again.", "error");
                }
            } catch (err) {
                shakeDigits();
                showOtpMsg(err.message || "Verification failed. Please try again.", "error");
            } finally {
                verifyBtn.disabled    = false;
                verifyBtn.textContent = "Verify & Create Account";
            }
        }

        verifyBtn.addEventListener("click", verifyOtp);

        // ── Resend — re-submit the registration form silently ─────────────
        resendBtn.addEventListener("click", async () => {
            resendBtn.disabled    = true;
            resendBtn.textContent = "Sending…";
            clearOtpMsg();

            const fullName = document.getElementById("fullName").value.trim();
            const email    = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const params = new URLSearchParams({ fullName, email, password });
                const data = await apiFetch("/register", {
                    method:  "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body:    params
                });

                if (data.success && data.requiresVerification) {
                    clearOtp();
                    digits[0].focus();
                    startTimer(5 * 60);
                    startResendCooldown(30);
                    showOtpMsg("New code sent!", "success");
                    setTimeout(clearOtpMsg, 3000);
                } else {
                    showOtpMsg(data.message || "Could not resend. Please go back and try again.", "error");
                    resendBtn.disabled    = false;
                    resendBtn.textContent = "Resend code";
                }
            } catch (err) {
                showOtpMsg(err.message || "Could not resend. Please try again.", "error");
                resendBtn.disabled    = false;
                resendBtn.textContent = "Resend code";
            }
        });

        // ── Back button ────────────────────────────────────────────────────
        document.getElementById("backToRegister").addEventListener("click", showRegisterPanel);

    })();
</script>
</body>
</html>
