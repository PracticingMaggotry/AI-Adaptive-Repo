# Isolated in-memory test database. Never points at Railway or a production database.
spring.datasource.url=jdbc:h2:mem:adaptive_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Prevent missing external API credentials from blocking context startup in tests.
anthropic.api.key=test-key-not-used
resend.api.key=test-key-not-used
